<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper.io 2 - Web Edition</title>
    <meta name="description" content="Paper.io 2 Official Web Clone - Capture territory, eliminate rivals, and conquer the leaderboard!">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- Main Fullscreen Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Top Left Score Badges (Matching Image 2) -->
        <div class="top-left-hud">
            <div class="score-pill">
                <div id="playerPctFill" class="score-fill" style="width: 25.18%;"></div>
                <span id="playerPctText">25.18 %</span>
            </div>
            <div class="kills-pill">
                <span class="skull-icon">💀</span>
                <span id="playerKillsText">x0</span>
            </div>
        </div>

        <!-- Top Right Leaderboard & Coins (Matching Image 2) -->
        <div class="top-right-hud">
            <div class="coins-badge">
                <span id="coinsText">12,591</span>
                <span class="coin-icon">🪙</span>
            </div>
            <div id="leaderboardList" class="leaderboard-cards">
                <!-- Dynamic Paper.io 2 Leaderboard Cards -->
            </div>
        </div>

        <!-- Bottom Left Radar Minimap (Matching Image 2) -->
        <div class="bottom-left-hud">
            <div class="minimap-container">
                <canvas id="minimapCanvas" width="120" height="120"></canvas>
                <div class="minimap-ring"></div>
            </div>
        </div>

        <!-- Bottom Right Presentation Controls -->
        <div class="bottom-right-hud">
            <button id="btn-demo-capture" class="btn-demo">⚡ Demo Capture</button>
            <button id="btn-demo-elim" class="btn-demo">💥 Demo Kill</button>
            <button id="btn-db-modal" class="btn-demo-sec">📊 JDBC Records</button>
        </div>

        <!-- Game Over / Victory Screen Overlay -->
        <div id="gameOverlay" class="overlay hidden">
            <div class="overlay-card">
                <h1 id="overlayTitle">YOU DIED</h1>
                <p id="overlaySubtitle">Conquered 0.00% of the arena</p>
                <div id="overlayRankings" class="overlay-rankings"></div>
                <div class="overlay-actions">
                    <button id="btn-restart" class="btn-play">PLAY AGAIN</button>
                </div>
            </div>
        </div>

        <!-- JDBC & Match Records Modal -->
        <div id="dbModal" class="modal hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h2>🏆 JDBC Match Database</h2>
                    <button id="btn-close-modal" class="btn-close">&times;</button>
                </div>
                <div class="modal-body">
                    <table class="db-table">
                        <thead>
                            <tr>
                                <th>Match #</th>
                                <th>Timestamp</th>
                                <th>Winner</th>
                                <th>Territory %</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody id="dbHistoryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
